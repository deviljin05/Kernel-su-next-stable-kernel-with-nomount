      - name: Apply NetHunter WiFi injection patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import pathlib

          def patch(path, old, new, label):
              p = pathlib.Path(path)
              if not p.exists():
                  print(f"[skip] {label}: {path} not found")
                  return
              text = p.read_text()
              n = text.count(old)
              if n != 1:
                  print(f"[WARN] {label}: expected 1 match, found {n} — skipping")
                  return
              p.write_text(text.replace(old, new, 1))
              print(f"[ok] {label}")

          patch("net/mac80211/tx.c", "\tif (unlikely(info->control.vif->type == NL80211_IFTYPE_MONITOR))\n\t\treturn TX_CONTINUE;\n", "\tif (unlikely((info->flags & IEEE80211_TX_CTL_INJECTED) &&\n\t   !(tx->sdata->u.mntr.flags & MONITOR_FLAG_COOK_FRAMES))) {\n\t\tif (!ieee80211_has_morefrags(hdr->frame_control))\n\t\t\tinfo->flags |= IEEE80211_TX_CTL_NO_ACK;\n\t\treturn TX_CONTINUE;\n\t}\n", "mac80211 injected packet seqno/NO_ACK")
          patch("net/mac80211/tx.c", "\tieee80211_set_qos_hdr(sdata, skb);\n\tieee80211_tx(sdata, sta, skb, false);\n", "        if (likely(info->control.vif->type != NL80211_IFTYPE_MONITOR)) {\n            ieee80211_set_qos_hdr(sdata, skb);\n        }\n\tieee80211_tx(sdata, sta, skb, false);\n", "mac80211 skip QoS hdr in monitor mode")
          patch("net/wireless/chan.c", "\tif (!cfg80211_has_monitors_only(rdev))\n\t\treturn -EBUSY;\n", "\t// Always allow user to change channel\n", "cfg80211 monitor channel EBUSY removal")
          patch("drivers/net/wireless/realtek/rtl818x/rtl8187/dev.c", "\tif (ieee80211_has_morefrags(tx_hdr->frame_control))\n\t\tflags |= RTL818X_TX_DESC_FLAG_MOREFRAG;\n", "\n\tif (ieee80211_has_morefrags(tx_hdr->frame_control))\n\t{\n\t\tif (likely(info->control.vif != NULL && info->control.vif->type != NL80211_IFTYPE_MONITOR)) {\n\t\t\tflags |= RTL818X_TX_DESC_FLAG_MOREFRAG;\n\t\t}\n\t}\n", "rtl8187 monitor MOREFRAG fix")
          patch("drivers/net/wireless/zydas/zd1211rw/zd_mac.c", "static int set_rx_filter(struct zd_mac *mac)\n{\n\tunsigned long flags;\n\tu32 filter = STA_RX_FILTER;\n\n\tspin_lock_irqsave(&mac->lock, flags);\n\tif (mac->pass_ctrl)\n\t\tfilter |= RX_FILTER_CTRL;\n\tspin_unlock_irqrestore(&mac->lock, flags);\n\n\treturn zd_iowrite32(&mac->chip, CR_RX_FILTER, filter);\n}\n", "static int set_rx_filter(struct zd_mac *mac)\n{\n\tunsigned long flags;\n\tstruct zd_ioreq32 ioreqs[] = {\n\t\t{CR_RX_FILTER, STA_RX_FILTER},\n\t\t{ CR_SNIFFER_ON, 0U },\n\t};\n\n\tspin_lock_irqsave(&mac->lock, flags);\n\tif (mac->pass_ctrl) {\n\t\tioreqs[0].value |= 0xFFFFFFFF;\n\t\tioreqs[1].value = 0x1;\n\t}\n\tspin_unlock_irqrestore(&mac->lock, flags);\n\n\treturn zd_iowrite32a(&mac->chip, ioreqs, ARRAY_SIZE(ioreqs));\n}\n", "zd1211rw set_rx_filter sniffer fix")
          patch("drivers/net/wireless/zydas/zd1211rw/zd_mac.c", "\tif (status->frame_status & ZD_RX_ERROR) {\n", "\tif ((status->frame_status & ZD_RX_ERROR) || \n\t\t(status->frame_status & ~0x21)) {\n", "zd1211rw monitor frame acceptance")
          patch("drivers/net/wireless/zydas/zd1211rw/zd_mac.c", "\tieee80211_hw_set(hw, SIGNAL_UNSPEC);\n", "\tieee80211_hw_set(hw, SIGNAL_DBM);\n", "zd1211rw SIGNAL_DBM")
          PYEOF

      - name: Apply NTSync patches
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          if [ "${SUBLEVEL}" -le "208" ]; then
            curl -LSs -o /tmp/0003-lockdep-assert-none-held.patch https://raw.githubusercontent.com/WildKernels/GKI_KernelSU_SUSFS/main/.github/actions/ntsync/patches/0003-lockdep-assert-none-held.patch
            patch -p1 -N < /tmp/0003-lockdep-assert-none-held.patch || echo "::warning::lockdep fix did not apply"
          fi
          curl -LSs -o /tmp/ntsync_compat_android12-5.10.patch https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_compat_android12-5.10.patch
          patch -p1 < /tmp/ntsync_compat_android12-5.10.patch || echo "::warning::ntsync compat patch had rejects"
          curl -LSs -o /tmp/ntsync_base.patch https://raw.githubusercontent.com/WildKernels/kernel_patches/main/common/ntsync/ntsync_base.patch
          patch -p1 < /tmp/ntsync_base.patch || echo "::warning::ntsync base patch had rejects"
          echo "CONFIG_NTSYNC=y" >> arch/arm64/configs/gki_defconfig

      - name: Apply Droidspaces kABI-safe patches
        working-directory: kernel_workspace/common

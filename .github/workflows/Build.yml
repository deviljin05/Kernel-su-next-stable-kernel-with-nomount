      - name: Clean dirty flag
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          sed -i 's/-dirty//' common/scripts/setlocalversion
          cd common
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "Clean dirty flag" --allow-empty -q

      - name: Apply custom kernel branding
        working-directory: kernel_workspace/common
        run: |
          set -euo pipefail
          mv scripts/setlocalversion scripts/setlocalversion.orig
          chmod +x scripts/setlocalversion.orig
          cat > scripts/setlocalversion << 'SETLOCALVERSION_EOF'
          #!/bin/sh
          printf -- '-BLAZE-KSUN-STABLE\n'
          SETLOCALVERSION_EOF
          chmod +x scripts/setlocalversion

      - name: Disable strict defconfig verification
        working-directory: kernel_workspace
        run: sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: Disable modules list verification
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          for f in common/build.config.gki common/build.config.gki.aarch64 common/build.config.common common/build.config.aarch64; do
            [ -f "$f" ] || continue
            sed -i 's/^MODULES_LIST=.*/MODULES_LIST=/' "$f"
            sed -i 's/^MODULES_ORDER=.*/MODULES_ORDER=/' "$f"
            sed -i 's/^TRIM_NONLISTED_KMI=.*/TRIM_NONLISTED_KMI=0/' "$f"
            sed -i 's/^KMI_SYMBOL_LIST=.*/KMI_SYMBOL_LIST=/' "$f"
            sed -i 's/^KMI_SYMBOL_LIST_STRICT_MODE=.*/KMI_SYMBOL_LIST_STRICT_MODE=0/' "$f"
            sed -i 's/^KMI_ENFORCED=.*/KMI_ENFORCED=0/' "$f"
          done
          echo "MODULES_LIST + KMI checks disabled"

      - name: Ensure generic ld exists
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          LLD_PATH=$(find prebuilts-master -type f -name 'ld.lld' | head -n1)
          if [ -n "$LLD_PATH" ]; then
            BIN_DIR=$(dirname "$LLD_PATH")
            [ -e "$BIN_DIR/ld" ] || ln -s ld.lld "$BIN_DIR/ld"
            echo "Symlinked ld -> ld.lld in $BIN_DIR"
            echo "CLANG_BIN_DIR=${BIN_DIR}" >> "$GITHUB_ENV"
          else
            echo "::warning::no ld.lld found under prebuilts-master"
          fi

      - name: Build kernel
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          export KBUILD_BUILD_USER="builder"
          export KBUILD_BUILD_HOST="ci"
          LTO=thin \
          SKIP_MRPROPER=1 \
          BUILD_CONFIG=common/build.config.gki.aarch64 \
          USE_CCACHE=1 \
          CCACHE_DIR="${{ env.CCACHE_DIR }}" \
          build/build.sh -j"$(nproc)"

      - name: Verify NoMount is built into the kernel
        if: ${{ github.event.inputs.enable_nomount == 'true' }}
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          CFG="$(find out -name .config -path '*common*' | head -n1)"
          [ -n "$CFG" ] || { echo "::error::final .config not found under out/"; exit 1; }
          grep -q '^CONFIG_NOMOUNT=y$' "$CFG" || { echo "::error::CONFIG_NOMOUNT=y is missing from the final .config (dropped by a Kconfig dependency?)"; exit 1; }
          grep -E '^CONFIG_(KSU|NOMOUNT)' "$CFG"

      - name: Locate built Image
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          IMG=$(find out -path "*dist/Image" | head -n1)
          if [ -z "$IMG" ]; then IMG=$(find out -name "Image" | head -n1); fi
          if [ -z "$IMG" ]; then echo "::error::No kernel Image found"; exit 1; fi
          echo "Found Image at: $IMG"
          echo "IMG_PATH=kernel_workspace/${IMG}" >> "$GITHUB_ENV"

      - name: Locate build output dir
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          SYMVERS=$(find out -name "Module.symvers" | head -n1)
          if [ -z "$SYMVERS" ]; then echo "::error::No Module.symvers found"; exit 1; fi
          KDIR="$(cd "$(dirname "$SYMVERS")" && pwd)"
          echo "Using KDIR: $KDIR"
          echo "KDIR=${KDIR}" >> "$GITHUB_ENV"
          CFG80211_KO=$(find out -name "cfg80211.ko" | head -n1 || true)
          echo "CFG80211_KO=${CFG80211_KO:-}" >> "$GITHUB_ENV"

      - name: Build RTL8188EU / RTL8188EUS Wi-Fi driver
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          git clone --depth=1 -b v5.3.9 https://github.com/aircrack-ng/rtl8188eus.git rtl8188eus
          LLVM_AR_PATH=$(find prebuilts-master -type f -name 'llvm-ar' | head -n1)
          if [ -z "$LLVM_AR_PATH" ]; then echo "::error::llvm-ar not found"; exit 1; fi
          LLVM_BIN_DIR="$(cd "$(dirname "$LLVM_AR_PATH")" && pwd)"
          echo "Using LLVM toolchain at: $LLVM_BIN_DIR"
          export PATH="${LLVM_BIN_DIR}:${PATH}"
          cd rtl8188eus
          DRVDIR="$(pwd)"

          sed -i -E 's/\bEXTRA_CFLAGS\b/ccflags-y/g; s/\bEXTRA_LDFLAGS\b/ldflags-y/g' Makefile

          LICENSE_FILE=$(grep -rl "MODULE_LICENSE(" --include="*.c" . | head -n1)
          if [ -n "$LICENSE_FILE" ]; then
            echo "Adding MODULE_IMPORT_NS to: $LICENSE_FILE"
            sed -i "/MODULE_LICENSE(/a MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);" "$LICENSE_FILE"
          fi

          make -C "${KDIR}" M="${DRVDIR}" \
            ARCH=arm64 SUBARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC="${LLVM_BIN_DIR}/clang" LD="${LLVM_BIN_DIR}/ld.lld" \
            AR="${LLVM_BIN_DIR}/llvm-ar" NM="${LLVM_BIN_DIR}/llvm-nm" \
            OBJCOPY="${LLVM_BIN_DIR}/llvm-objcopy" OBJDUMP="${LLVM_BIN_DIR}/llvm-objdump" \
            STRIP="${LLVM_BIN_DIR}/llvm-strip" READELF="${LLVM_BIN_DIR}/llvm-readelf" \
            CROSS_COMPILE=aarch64-linux-android- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CONFIG_RTL8188EU=m CONFIG_RTL8188E=y CONFIG_MULTIDRV=n \
            KCFLAGS="-DCONFIG_LITTLE_ENDIAN -DCONFIG_IOCTL_CFG80211 -DRTW_USE_CFG80211_STA_EVENT -Wno-error -Wno-unknown-warning-option -Wno-implicit-function-declaration" \
            modules 2>&1 | tee build.log

          KO=$(find . -maxdepth 1 -name "*.ko" | head -n1)
          if [ -z "$KO" ]; then
            echo "::error::rtl8188eus build did not produce a .ko file."
            tail -n 40 build.log
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/driver_out"
          "${LLVM_BIN_DIR}/llvm-strip" --strip-debug --strip-unneeded "$KO" -o "$GITHUB_WORKSPACE/driver_out/8188eu.ko"
          echo "Built driver: $KO"

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 ak3
          cp "${{ env.IMG_PATH }}" ak3/Image
          cd ak3
          zip -r9 -q "$GITHUB_WORKSPACE/${{ github.event.inputs.device_name }}-KSUNext-android12-5.10-susfs${SUSFS_COMMIT:0:8}.zip" . -x ".git*"
          ls -lh "$GITHUB_WORKSPACE"/*.zip

      - name: Generate NetHunter Wireless Magisk Module
        working-directory: kernel_workspace
        run: |
          set -euo pipefail
          mkdir -p wireless_module/system/lib/modules
          mkdir -p wireless_module/META-INF/com/google/android
          find out -name "*.ko" -exec cp {} wireless_module/system/lib/modules/ \; || true
          COUNT=$(find wireless_module/system/lib/modules -name "*.ko" | wc -l)
          echo "Packaging ${COUNT} .ko modules"

          cat > wireless_module/module.prop << 'EOF'
          id=Wireless-LKM
          name=NetHunter Wireless LKM
          version=v1
          versionCode=1
          author=Blaze
          description=NetHunter wireless kernel modules
          EOF

          cat > wireless_module/service.sh << 'EOF'
          #!/system/bin/sh
          sleep 25
          LOG=/data/local/tmp/nethunter_wireless.log
          MODDIR=/data/adb/modules/Wireless-LKM/system/lib/modules
          echo "===== $(date) =====" >> $LOG
          echo /vendor/firmware > /sys/module/firmware_class/parameters/path 2>>$LOG

          load(){ MOD="$1"; if [ -f "$MODDIR/$MOD.ko" ]; then insmod "$MODDIR/$MOD.ko" >>$LOG 2>&1; fi; }
          load cfg80211
          load mac80211
          load ath
          load ath9k_hw
          load ath9k_common
          load ath9k_htc
          load carl9170
          load rt2x00lib
          load rt2x00usb
          load rt2800lib
          load rt2800usb
          load rt73usb
          load rtl8187
          load rtl8192cu
          load rtl8xxxu
          load mt7601u
          load mt76
          load mt76-usb
          load mt76x0-common
          load mt76x0u
          load mt76x2-common
          load mt76x2u
          load rtw88_core
          load rtw88_usb
          load rtw88_8812au
          load rtw88_8814au
          load rtw88_8821au
          load rtw88_8822bu
          load rtw88_8821cu
          load rtw88_8723du
          load zd1211rw
          load crc-itu-t
          load michael_mic

          dmesg | grep -i -E "cfg80211|mac80211|ath|rt2x00|rt2800|rtl|rtw88|mt76|zd1211|firmware" >> $LOG 2>&1
          EOF
          chmod +x wireless_module/service.sh

          cat > wireless_module/META-INF/com/google/android/update-binary << 'EOF'
          #!/sbin/sh
          mount /data 2>/dev/null
          unzip -o "$3" 'system/*' -d /data/adb/modules/Wireless-LKM/ 2>/dev/null
          cp -rf service.sh /data/adb/modules/Wireless-LKM/
          cp -rf module.prop /data/adb/modules/Wireless-LKM/
          touch /data/adb/modules/Wireless-LKM/update
          exit 0
          EOF
          chmod +x wireless_module/META-INF/com/google/android/update-binary

          cd wireless_module
          zip -r9 -q "$GITHUB_WORKSPACE/Wireless_LKM.zip" .
          echo "Magisk module created: $GITHUB_WORKSPACE/Wireless_LKM.zip"

      - name: Generate RTL8188EU/EUS Magisk Module
        run: |
          set -euo pipefail
          mkdir -p wifi_module/system/lib/modules
          mkdir -p wifi_module/META-INF/com/google/android
          cp "$GITHUB_WORKSPACE/driver_out/8188eu.ko" wifi_module/system/lib/modules/
          if [ -n "${CFG80211_KO:-}" ] && [ -f "${CFG80211_KO}" ]; then
            cp "${CFG80211_KO}" wifi_module/system/lib/modules/
          fi

          cat > wifi_module/module.prop << 'EOF'
          id=RTL8188EU-EUS-Driver
          name=RTL8188EU/EUS Wi-Fi Driver
          version=v5.3.9
          versionCode=1
          author=Blaze
          description=RTL8188EU/RTL8188EUS/RTL8188ETV Wi-Fi driver with monitor mode & injection support
          EOF

          cat > wifi_module/service.sh << 'EOF'
          #!/system/bin/sh
          sleep 20
          LOG=/data/local/tmp/rtl8188eu.log
          MODDIR=/data/adb/modules/RTL8188EU-EUS-Driver/system/lib/modules
          load(){ MOD="$1"; if [ -f "$MODDIR/$MOD.ko" ]; then insmod "$MODDIR/$MOD.ko" >>$LOG 2>&1; fi; }
          load cfg80211
          load 8188eu
          dmesg | grep -i -E "8188eu|cfg80211|rtw_" >> $LOG 2>&1
          EOF
          chmod +x wifi_module/service.sh

          cat > wifi_module/META-INF/com/google/android/update-binary << 'EOF'
          #!/sbin/sh
          mount /data 2>/dev/null
          unzip -o "$3" 'system/*' -d /data/adb/modules/RTL8188EU-EUS-Driver/ 2>/dev/null
          cp -rf service.sh /data/adb/modules/RTL8188EU-EUS-Driver/
          cp -rf module.prop /data/adb/modules/RTL8188EU-EUS-Driver/
          touch /data/adb/modules/RTL8188EU-EUS-Driver/update
          exit 0
          EOF
          chmod +x wifi_module/META-INF/com/google/android/update-binary

          cd wifi_module
          zip -r9 -q "$GITHUB_WORKSPACE/RTL8188EU-EUS-Driver.zip" .
          echo "Magisk module created: $GITHUB_WORKSPACE/RTL8188EU-EUS-Driver.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.device_name }}-build
          path: |
            ${{ github.workspace }}/*.zip
          if-no-files-found: error
          retention-days: 14
